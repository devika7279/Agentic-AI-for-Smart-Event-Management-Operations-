
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - EventOps AI</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
            color: #333;
        }

        /* Navigation Bar */
        nav {
            background: #1268f5;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        nav h2 {
            color: white;
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }

        nav a:hover {
            color: #d9e5ff;
        }

        /* Page Heading */
        .header {
            margin: 25px 15px;
            padding: 30px 20px;
            text-align: center;
            color: white;
            border-radius: 25px;
            background: linear-gradient(
                120deg, #2165ff, #7724ed, #d32891
            );
        }

        .header h1 {
            margin-top: 0;
            font-size: 36px;
        }

        .header p {
            margin-bottom: 0;
            font-size: 17px;
        }

        /* Contact Form */
        .container {
            display: flex;
            justify-content: center;
            padding: 10px 20px 30px;
        }

        .contact-form {
            width: 100%;
            max-width: 700px;
            padding: 30px;
            border-radius: 18px;
            background: #f5f7fa;
            box-sizing: border-box;
        }

        .contact-form h2 {
            color: #1268f5;
            margin-top: 0;
        }

        .contact-form p {
            color: #666;
            font-size: 14px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            font-size: 14px;
            background: white;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #1268f5;
        }

        textarea {
            height: 130px;
            resize: vertical;
        }

        /* Send Button */
        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            border: none;
            border-radius: 20px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(
                90deg, #1268f5, #6818ed
            );
        }

        button:hover {
            opacity: 0.9;
        }

        /* Footer */
        footer {
            background: #202124;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 15px;
            font-size: 13px;
        }

        /* Mobile Layout */
        @media (max-width: 600px) {
            nav {
                justify-content: center;
                gap: 15px;
            }

            nav h2 {
                width: 100%;
                text-align: center;
            }

            nav a {
                margin: 5px;
                display: inline-block;
            }

            .header h1 {
                font-size: 28px;
            }

            .contact-form {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav>
        <h2>🤖 EventOps AI</h2>

        <div>
            <a href="/">Home</a>
            <a href="/login">Login</a>
            <a href="/register">Register</a>
            <a href="/contact">Contact</a>
            <a href="/about">About</a>
        </div>
    </nav>

    <!-- Heading -->
    <section class="header">
        <h1>Contact Us</h1>
        <p>Have questions? We would love to hear from you!</p>
    </section>

    <!-- Contact Form Only -->
    <div class="container">

        <section class="contact-form">
            <h2>✉ Send a Message</h2>
            <p>Fill in the form and we will get back to you.</p>

            <form action="/contact" method="POST">

                <label for="name">Full Name *</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

                <label for="email">Email Address *</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                >

                <label for="subject">Subject</label>
                <input
                    type="text"
                    id="subject"
                    name="subject"
                    placeholder="How can we help?"
                >

                <label for="message">Message *</label>
                <textarea
                    id="message"
                    name="message"
                    placeholder="Write your message here..."
                    required
                ></textarea>

                <button type="submit">➤ Send Message</button>

            </form>
        </section>

    </div>

    <!-- Footer -->
    <footer>
        &copy; 2026 EventOps AI | Autonomous Event Management Intelligence
    </footer>

</body>
</html>
